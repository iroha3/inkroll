<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>InkRoll Lite · 核心引擎排版打样台</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: #f5f5f7; color: #111; }
    #app { display: flex; gap: 16px; padding: 16px; box-sizing: border-box; min-height: 100vh; align-items: flex-start; }
    #left { width: 440px; flex-shrink: 0; display: flex; flex-direction: column; gap: 10px; }
    #right { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 16px; }
    h1.demo-title { font-size: 16px; margin: 0; font-weight: 700; }
    h1.demo-title small { font-weight: 400; color: #6b7280; font-size: 13px; }
    #md-input { width: 100%; height: 320px; box-sizing: border-box; font: 13px/1.5 ui-monospace, Consolas, monospace; padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; resize: vertical; background: #fff; }
    #controls { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 10px; font-size: 12px; }
    #controls label { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
    #controls label.full { grid-column: 1 / -1; }
    #controls select, #controls input[type="number"], #controls input[type="text"] { flex: 1; min-width: 0; padding: 4px 6px; border: 1px solid #d1d5db; border-radius: 4px; }
    #controls input[type="checkbox"] { width: auto; }
    #buttons { display: flex; gap: 8px; }
    #buttons button { flex: 1; padding: 8px 0; font-size: 13px; cursor: pointer; border: 1px solid #d1d5db; border-radius: 6px; background: #fff; font-weight: 500; }
    #buttons button:hover { background: #f3f4f6; }
    #buttons button.primary { background: #2563eb; color: #fff; border-color: #2563eb; }
    #buttons button.primary:hover { background: #1d4ed8; }
    .panel { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 12px; }
    .panel-title { font-size: 12px; color: #6b7280; margin-bottom: 8px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
    #card-host { overflow-x: auto; padding: 24px 8px; background: #f5f5f7; border-radius: 6px; display: flex; justify-content: center; }
    #img-host img { max-width: 100%; border: 1px solid #e5e7eb; display: block; border-radius: 6px; }
    #img-info { font-size: 12px; color: #6b7280; margin-top: 8px; }
  </style>
</head>
<body>
<div id="app">
  <div id="left">
    <h1 class="demo-title">InkRoll Lite <small>· 排版打样与回归测试</small></h1>
    <textarea id="md-input" spellcheck="false" placeholder="输入 Markdown..."></textarea>
    <div class="panel">
      <div class="panel-title">引擎参数</div>
      <div id="controls">
        <label>主题
          <select id="opt-theme"></select>
        </label>
        <label>宽度
          <input type="number" id="opt-width" value="500" min="300" max="1000" step="20">
        </label>
        <label>字体
          <select id="opt-font">
            <option value="sans">Sans (无衬线)</option>
            <option value="serif">Serif (衬线)</option>
            <option value="mono">Mono (等宽)</option>
          </select>
        </label>
        <label>字号
          <input type="number" id="opt-fontsize" value="15" min="12" max="24" step="0.5">
        </label>
        <label>行高
          <select id="opt-lineheight">
            <option value="relaxed">Relaxed (舒适)</option>
            <option value="normal">Normal (紧凑)</option>
            <option value="loose">Loose (宽松)</option>
          </select>
        </label>
        <label>内边距
          <select id="opt-padding">
            <option value="normal">Normal (中)</option>
            <option value="compact">Compact (紧凑)</option>
            <option value="spacious">Spacious (宽松)</option>
          </select>
        </label>
        <label>圆角
          <input type="number" id="opt-radius" value="12" min="0" max="32">
        </label>
        <label>倍率
          <select id="opt-scale">
            <option value="2">2x</option>
            <option value="3" selected>3x (超清)</option>
          </select>
        </label>
        <label class="full"><input type="checkbox" id="opt-watermark" checked> 启用水印
          <input type="text" id="opt-watermark-text" value="By InkRoll" style="margin-left: 8px;">
        </label>
      </div>
    </div>
    <div id="buttons">
      <button id="btn-render" class="primary">实时打样渲染</button>
      <button id="btn-export">导出 PNG 预览</button>
      <button id="btn-download">下载 PNG</button>
    </div>
  </div>

  <div id="right">
    <div class="panel">
      <div class="panel-title">DOM 实时渲染效果（卡片）</div>
      <div id="card-host"></div>
    </div>
    <div class="panel">
      <div class="panel-title">SVG foreignObject 导出光栅化打样（PNG）</div>
      <div id="img-host"></div>
      <div id="img-info">点击“导出 PNG 预览”即可测试导出管线</div>
    </div>
  </div>
</div>

<script id="test-doc" type="text/markdown">

</body>
</html>
